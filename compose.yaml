services:
  api:
    build:
      context: .
      dockerfile: Api/Dockerfile
    container_name: Tbot
  
    ports:
      - "5005:8080"
    
    environment:
       ASPNETCORE_ENVIRONMENT: "Production"
       ASPNETCORE_URLS: "http://+:8080"
       Telegram__BotToken : "${TELEGRAM_BOT_TOKEN}"
       Telegram__ChatIds__0: "${TELEGRAM_CHAT_IDS_0}"
       Telegram__ChatIds__1: "${TELEGRAM_CHAT_IDS_1}"
    volumes:
      - /var/lib/tbot-data:/var/lib/tbot-data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always